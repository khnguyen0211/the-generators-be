version: "3.8"

services:
  # Flask API Server
  api:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./output:/app/output
      - ./src/logs:/app/src/logs
    environment:
      - APP_ENV=dev
    env_file:
      - ./env/.env.dev
    depends_on:
      - redis
    restart: unless-stopped

  # Redis for job queue
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
